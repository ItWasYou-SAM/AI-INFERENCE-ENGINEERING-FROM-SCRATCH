<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">The learning path</title>
  <desc id="desc">Four levels. Beginner: orientation, LLM forward pass, GPU first principles, roofline. Intermediate: CUDA, parallel patterns, GEMM, profiling, transformer kernels. Advanced: KV cache, engine internals, decoding, quantization, benchmarking. Expert: multi-GPU, distributed serving, economics, capstone.</desc>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.25  0 0 0 0 0.12  0 0 0 0.55 0"/>
    </filter>
    <radialGradient id="age" cx="50%" cy="45%" r="75%">
      <stop offset="60%" stop-color="#f1e6cf" stop-opacity="0"/>
      <stop offset="100%" stop-color="#b8935a" stop-opacity="0.45"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10" fill="none" stroke="#3b2a1a" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="1200" height="560" rx="26" fill="#f1e6cf"/>
  <rect width="1200" height="560" rx="26" filter="url(#grain)" opacity="0.22"/>
  <rect width="1200" height="560" rx="26" fill="url(#age)"/>
  <rect x="14" y="14" width="1172" height="532" rx="18" fill="none" stroke="#7a6448" stroke-opacity="0.45" stroke-width="1.5"/>
  <rect x="22" y="22" width="1156" height="516" rx="14" fill="none" stroke="#7a6448" stroke-opacity="0.3" stroke-dasharray="2 6"/>
  <text x="600.0" y="72" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#3b2a1a">One path, four levels</text>
  <text x="600.0" y="104" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="19" fill="#7a6448">each level answers one question, and each chapter one idea</text>
  <g transform="rotate(-0.6 183.0 308)">
      <rect x="57" y="128" width="252" height="356" rx="6" fill="#f7eedb" stroke="#3b2a1a" stroke-opacity="0.55" stroke-width="1.4"/>
      <text x="79" y="192" font-family="Georgia, 'Times New Roman', serif" font-size="56" fill="#8c2f1b">1</text>
      <text x="131" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="2" fill="#7a6448">LEVEL 1</text>
      <text x="131" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold" fill="#3b2a1a">Beginner</text>
      <text x="79" y="232" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="19" fill="#3b2a1a">What is inference,</text>
      <text x="79" y="256" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="19" fill="#3b2a1a">and why is it hard?</text>
      <line x1="79" y1="276" x2="287" y2="276" stroke="#7a6448" stroke-opacity="0.5" stroke-dasharray="3 4"/>
      <text x="79" y="312" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#3b2a1a"><tspan fill="#7a6448">·</tspan> Orientation</text><text x="79" y="344" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#3b2a1a"><tspan fill="#7a6448">·</tspan> LLM forward pass</text><text x="79" y="376" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#3b2a1a"><tspan fill="#7a6448">·</tspan> GPU first principles</text><text x="79" y="408" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#3b2a1a"><tspan fill="#7a6448">·</tspan> Roofline model</text>
    </g><path d="M311 168 q 13.0 -14 22 0" fill="none" stroke="#8c2f1b" stroke-width="2" marker-end="url(#arrow)"/><g transform="rotate(0.5 461.0 308)">
      <rect x="335" y="128" width="252" height="356" rx="6" fill="#f7eedb" stroke="#3b2a1a" stroke-opacity="0.55" stroke-width="1.4"/>
      <text x="357" y="192" font-family="Georgia, 'Times New Roman', serif" font-size="56" fill="#7a6448">2</text>
      <text x="409" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="2" fill="#7a6448">LEVEL 2</text>
      <text x="409" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold" fill="#3b2a1a">Intermediate</text>
      <text x="357" y="232" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="19" fill="#3b2a1a">How do I write and</text>
      <text x="357" y="256" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="19" fill="#3b2a1a">optimize GPU code?</text>
      <line x1="357" y1="276" x2="565" y2="276" stroke="#7a6448" stroke-opacity="0.5" stroke-dasharray="3 4"/>
      <text x="357" y="312" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#3b2a1a"><tspan fill="#7a6448">·</tspan> CUDA fundamentals</text><text x="357" y="344" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#3b2a1a"><tspan fill="#7a6448">·</tspan> Parallel patterns</text><text x="357" y="376" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#3b2a1a"><tspan fill="#7a6448">·</tspan> GEMM &amp; memory</text><text x="357" y="408" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#3b2a1a"><tspan fill="#7a6448">·</tspan> Profiling</text><text x="357" y="440" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#3b2a1a"><tspan fill="#7a6448">·</tspan> Transformer kernels</text>
    </g><path d="M589 168 q 13.0 -14 22 0" fill="none" stroke="#8c2f1b" stroke-width="2" marker-end="url(#arrow)"/><g transform="rotate(-0.4 739.0 308)">
      <rect x="613" y="128" width="252" height="356" rx="6" fill="#f7eedb" stroke="#3b2a1a" stroke-opacity="0.55" stroke-width="1.4"/>
      <text x="635" y="192" font-family="Georgia, 'Times New Roman', serif" font-size="56" fill="#7a6448">3</text>
      <text x="687" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="2" fill="#7a6448">LEVEL 3</text>
      <text x="687" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold" fill="#3b2a1a">Advanced</text>
      <text x="635" y="232" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="19" fill="#3b2a1a">How do I build and</text>
      <text x="635" y="256" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="19" fill="#3b2a1a">tune a serving engine?</text>
      <line x1="635" y1="276" x2="843" y2="276" stroke="#7a6448" stroke-opacity="0.5" stroke-dasharray="3 4"/>
      <text x="635" y="312" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#3b2a1a"><tspan fill="#7a6448">·</tspan> KV cache</text><text x="635" y="344" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#3b2a1a"><tspan fill="#7a6448">·</tspan> Engine internals</text><text x="635" y="376" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#3b2a1a"><tspan fill="#7a6448">·</tspan> Decoding &amp; sampling</text><text x="635" y="408" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#3b2a1a"><tspan fill="#7a6448">·</tspan> Quantization</text><text x="635" y="440" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#3b2a1a"><tspan fill="#7a6448">·</tspan> Benchmarking</text>
    </g><path d="M867 168 q 13.0 -14 22 0" fill="none" stroke="#8c2f1b" stroke-width="2" marker-end="url(#arrow)"/><g transform="rotate(0.6 1017.0 308)">
      <rect x="891" y="128" width="252" height="356" rx="6" fill="#f7eedb" stroke="#3b2a1a" stroke-opacity="0.55" stroke-width="1.4"/>
      <text x="913" y="192" font-family="Georgia, 'Times New Roman', serif" font-size="56" fill="#7a6448">4</text>
      <text x="965" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="2" fill="#7a6448">LEVEL 4</text>
      <text x="965" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold" fill="#3b2a1a">Expert</text>
      <text x="913" y="232" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="19" fill="#3b2a1a">How do I run</text>
      <text x="913" y="256" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="19" fill="#3b2a1a">inference at scale?</text>
      <line x1="913" y1="276" x2="1121" y2="276" stroke="#7a6448" stroke-opacity="0.5" stroke-dasharray="3 4"/>
      <text x="913" y="312" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#3b2a1a"><tspan fill="#7a6448">·</tspan> Multi-GPU parallelism</text><text x="913" y="344" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#3b2a1a"><tspan fill="#7a6448">·</tspan> Distributed serving</text><text x="913" y="376" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#3b2a1a"><tspan fill="#7a6448">·</tspan> Economics &amp; control plane</text><text x="913" y="408" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#3b2a1a"><tspan fill="#7a6448">·</tspan> Capstone: ship a service</text>
    </g>
</svg>